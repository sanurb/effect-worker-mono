# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-console-log
language: tsx
severity: error
message: "Use Effect logging or app-specific logging instead of console methods"

rule:
  any:
    - pattern: console.log($$$ARGS)
    - pattern: console.warn($$$ARGS)
    - pattern: console.error($$$ARGS)
    - pattern: console.info($$$ARGS)

files:
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "packages/**/*.ts"
  - "packages/**/*.tsx"

ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.d.ts"
  - "**/*.gen.ts"
  - "**/*.gen.tsx"
  # `ndjson-sink.ts` is the designated I/O boundary where the NDJSON
  # tracer calls through to the worker's `console.log`/`console.warn`
  # streams. Every other file must route through these helpers.
  - "packages/cloudflare/src/observability/ndjson-sink.ts"
  - "**/node_modules/**"
