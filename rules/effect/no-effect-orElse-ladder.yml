# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-effect-orElse-ladder
language: tsx
severity: error
message: "Avoid Effect.orElse around sequencing chains. Move error handling to a single terminal decision after the pipeline."

rule:
  any:
    - pattern: pipe($FIRST, $$$, Effect.orElse($$$))
    - pattern: $EFFECT.pipe($$$, Effect.orElse($$$))

note: |
  orElse layered over sequencing chains hides error handling and splits the flow.
  Terminal error handling should be a single decision after the pipeline completes.

  WRONG:
    Effect.orElse(
      pipe(getUser(id), Effect.flatMap(validateUser), Effect.as(unit)),
      () => Effect.fail(new NotFoundError())
    )

  CORRECT:
    pipe(
      getUser(id),
      Effect.flatMap(validateUser),
      Effect.catchTag("NotFound", () => Effect.fail(new NotFoundError()))
    )

files:
  - "apps/**/*.ts"
  - "apps/**/*.tsx"
  - "packages/**/*.ts"
  - "packages/**/*.tsx"

ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.d.ts"
  - "**/*.gen.ts"
  - "**/*.gen.tsx"
  - "**/node_modules/**"
