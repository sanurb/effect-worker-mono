# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/typescript_rule.json

id: no-interface-in-models
language: tsx
severity: error
message: "Use Effect Schema definitions instead of exported interfaces for domain/contracts models"

rule:
  pattern: export interface $NAME { $$$BODY }

files:
  - "packages/domain/src/**/*.ts"
  - "packages/contracts/src/**/*.ts"

ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.d.ts"
  - "**/node_modules/**"
