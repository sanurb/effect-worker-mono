name: Check
on:
  workflow_dispatch: null
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Vite+ check (fmt + lint)
        # `vp check` does not accept `--disable-nested-config`, and without
        # it oxlint walks into `.repos/effect/.oxlintrc.json` and crashes on
        # the missing `@effect/oxc/oxlint` plugin. The npm scripts wrap fmt
        # and lint with the right flag, so use them here.
        run: pnpm format:check && pnpm lint
      - name: ast-grep architecture rules
        run: pnpm exec sg scan
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build packages
        # `vp run build:packages` dispatches the dependency-ordered tsgo
        # build defined in vite.config.ts run.tasks. Vite+ does not wrap
        # tsgo, but it owns the entry point.
        run: vp run build:packages
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Type check (tsgo)
        # `vp run types:check` dispatches `pnpm -r run check` (tsgo) via
        # vite.config.ts run.tasks.
        run: vp run types:check
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Vite+ test
        run: vp test run
        env:
          NODE_OPTIONS: --max_old_space_size=8192
