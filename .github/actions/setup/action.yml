name: Setup
description: Install pnpm, Node.js, Vite+ (`vp`), and project dependencies via `vp install`.
inputs:
  node-version:
    description: The version of Node.js to install
    required: true
    default: 24.5.0

runs:
  using: composite
  steps:
    - name: Install pnpm CLI
      # pnpm itself is still needed as a CLI for tools Vite+ does not wrap
      # (`pnpm sg:check`, `pnpm -r run check`, `pnpm build`).
      uses: pnpm/action-setup@v3
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
    - name: Install Vite+ (vp)
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: ${{ inputs.node-version }}
        cache: true
    - name: Install dependencies via Vite+
      shell: bash
      run: vp install
