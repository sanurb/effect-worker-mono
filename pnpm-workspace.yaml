packages:
  - packages/*
  - apps/*
  - tooling/*

# Single source of truth for shared dependency versions. Add a package here
# whenever it has ≥2 workspace consumers, or when we want to pin a floating
# range (e.g. `latest`) so installs stay reproducible.
catalog:
  # Effect ecosystem — kept in lockstep.
  effect: 4.0.0-beta.102
  "@effect/atom-react": 4.0.0-beta.102
  "@effect/sql-pg": 4.0.0-beta.102
  "@effect/tsgo": 0.24.3
  "@effect/vitest": 4.0.0-beta.102

  # TypeScript toolchain. `typescript@7` *is* the native (Go) compiler that used
  # to ship as `@typescript/native-preview`; the binary is `tsc`, not `tsgo`.
  # `@effect/tsgo@0.24.3` only patches the official layout
  # (`@typescript/typescript-<platform>-<arch>/lib/tsc`), so the preview channel
  # is no longer a supported host for the Effect language service.
  typescript: 7.0.2
  "@types/node": ^22.19.17

  # Vite+ unified toolchain. Pin the trio together so a downstream `npm publish`
  # cannot bump them silently — `vp upgrade` is the only supported bump path.
  # Since 0.2.0 Vite+ consumes *upstream* `vitest` (and its `@vitest/*` helper
  # packages) directly, so only `vite` is still an alias onto the Vite+ core.
  vite-plus: 0.2.6
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10
  "@vitest/runner": 4.1.10

  # Repo tooling.
  "@ast-grep/cli": ^0.42.1
  "@redwoodjs/agent-ci": ^0.8.2

  # Cloudflare Workers stack.
  "@cloudflare/workers-types": ^4.20260410.1
  wrangler: ^4.81.1

  # Drizzle ORM (db package + worker apps).
  drizzle-kit: 1.0.0-rc.3
  drizzle-orm: 1.0.0-rc.3

# `prefer` warns when a workspace package lists a literal version for a
# catalog-managed dep, instead of `catalog:`. Switch to `strict` once the
# warning surface is empty and we want pre-install enforcement.
catalogMode: prefer

# Vite+ still ships `vite` as `@voidzero-dev/vite-plus-core`, so the `vite`
# override forces every transitive consumer (Vite plugins, `@cloudflare/vite-plugin`,
# …) through the Vite+ core and keeps the toolchain unified behind `vp`. The
# `vitest` override pins upstream Vitest to the exact version Vite+ 0.2.6 bundles
# so `@effect/vitest` and `vp test` share one runner instance. The `effect`
# override likewise locks every transitive resolution to the catalog version.
overrides:
  effect: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"
  "@vitest/runner": "catalog:"

# `vite` remains aliased to `@voidzero-dev/vite-plus-core`, which is versioned
# independently of upstream Vite (`0.2.x` vs `7.x`). After the override above,
# any package that peer-depends on `vite@^5 || ^6 || ^7` resolves a literal
# `0.2.6`, which never satisfies a numeric range. This rule tells pnpm the
# mismatch is intentional. `vitest` no longer needs an entry here: Vite+ 0.2.x
# resolves to real `vitest@4.1.10`, which satisfies `@effect/vitest`'s
# `vitest@^3.0.0 || ^4.0.0` peer range on its own.
peerDependencyRules:
  allowedVersions:
    vite: "*"

# Native-bindings allowlist — pnpm refuses to run install scripts unless we
# opt in. pnpm 11 replaces the legacy `onlyBuiltDependencies` array with a
# map keyed by package name so we can also opt *out* explicitly when needed.
allowBuilds:
  "@ast-grep/cli": true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true
  workerd: true
