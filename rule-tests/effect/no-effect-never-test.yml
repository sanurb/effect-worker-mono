id: no-effect-never

valid:
  - |
    Effect.gen(function*() {
      yield* Effect.forkScoped(
        Effect.gen(function*() {
          while (true) {
            yield* processItem();
          }
        })
      );
    });

invalid:
  - |
    yield* Effect.never;
  - |
    const blocker = Effect.never;
