id: no-effect-sync-console

valid:
  - |
    Effect.logInfo("processing user");
  - |
    Effect.logDebug("value").pipe(Effect.annotateLogs({ key: "val" }));
  - |
    Effect.sync(() => metrics.increment("counter"));

invalid:
  - |
    Effect.sync(() => console.log("processing", userId));
  - |
    Effect.sync(() => console.error("failed"));
  - |
    Effect.sync(() => { console.warn("deprecated") });
